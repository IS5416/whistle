[project]
name = "whistle"
version = "0.1.0"
description = "Turn any character image into an animated clawd-on-desk desktop-pet theme"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0",
    "lxml>=5.0",
    "tinycss2>=1.3",
    "cssselect2>=0.8",
    "PyYAML>=6.0",
]
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
whistle = "whistle.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
